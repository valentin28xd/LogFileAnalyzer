[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-file-analyzer"
version = "0.1.0"
description = "Parse, summarize, filter, and visualize application log files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
]

[project.scripts]
log-analyzer = "log_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["log_analyzer*"]
